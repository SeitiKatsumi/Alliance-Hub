name: Validar e publicar no CapRover

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: caprover-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Exigir revisao transversal do diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          npm run platform:review -- --base "$BASE_SHA" --head HEAD

      - name: Validar contrato, conceitos, tipos, testes e build
        run: npm run platform:verify

  deploy:
    name: Publicar no CapRover
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Baixar codigo validado
        uses: actions/checkout@v4

      - name: Empacotar commit validado
        run: |
          git archive --format=tar --output=deploy.tar HEAD -- \
            .dockerignore \
            captain-definition \
            Dockerfile \
            package.json \
            package-lock.json \
            start.sh \
            migrate.cjs \
            tsconfig.json \
            vite.config.ts \
            postcss.config.js \
            tailwind.config.ts \
            client \
            server \
            shared \
            script \
            scripts \
            migrations \
            attached_assets/Logo_Built_2_Horizontal_Branca_Nova.png \
            attached_assets/Logo_Built_3_Horizontal_Negativo.png

      - name: Conferir configuracao de publicacao
        shell: bash
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          missing=0
          for variable in CAPROVER_SERVER CAPROVER_APP CAPROVER_APP_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "::error title=Configuracao ausente::Cadastre o segredo $variable no ambiente production do GitHub."
              missing=1
            fi
          done
          exit "$missing"

      - name: Enviar para o CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP }}
          token: ${{ secrets.CAPROVER_APP_TOKEN }}
